name: Fix Jentlemens navigation CSS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-jentlemens-nav-css.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy nav hiding rule
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/globals.css')
          s=p.read_text()
          old='@media(max-width:1000px){nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}'
          new='@media(max-width:1000px){.mainNav{display:flex!important;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.mainNav::-webkit-scrollbar{display:none}.grid{grid-template-columns:repeat(2,1fr)}'
          if old not in s:
            raise SystemExit('legacy nav rule not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-jentlemens-nav-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Jentlemens top navigation across breakpoints" || true
          git push
